<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-S8TKFCCYL3"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag("js", new Date());
  gtag("config", "G-S8TKFCCYL3");

<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">

<!-- Cac the SEO duoi day duoc JS ghi de theo tung danh muc sau khi tai du lieu -->
<title id="metaTitle">Category Coupons & Promo Codes 2026</title>
<meta id="metaDesc" name="description" content="Verified coupons and promo codes, updated regularly.">
<meta name="robots" content="index, follow">
<link id="metaCanonical" rel="canonical" href="https://couponsmarkets.com/">
<meta name="theme-color" content="#3DAF1F">

<link rel="stylesheet" href="/assets/style.css?v=15">
</head>
<body>

<header>
  <div class="wrap hd">
    <a href="/" class="logo"><img src="/assets/img/logo.png?v=1" alt="CouponsMarkets" class="logo-img"></a>
    <div class="search"><input type="text" id="searchInput" aria-label="Search">
      <svg fill="none" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <p class="breadcrumb"><a href="/" id="breadcrumbHome"></a><span>/</span><span id="breadcrumbCategory"></span></p>
    <section class="hero"><h1 id="categoryTitle"></h1><p id="categorySub"></p></section>
  </div>

  <div class="wrap">
    <div class="grid" id="grid"></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="foot">
      <div><div class="logo" style="margin-bottom:8px"><img src="/assets/img/logo.png?v=1" alt="CouponsMarkets" class="logo-img"></div><div id="footTag"></div></div>
      <div>
        <div style="font-weight:700;color:var(--footer-heading);margin-bottom:8px" id="footInfo"></div>
        <div><a href="/about" id="footAbout"></a></div>
        <div><a href="/privacy-policy" id="footPrivacy"></a></div>
        <div><a href="/terms-of-use" id="footTerms"></a></div>
        <div><a href="/contact" id="footContact"></a></div>
      </div>
    </div>
    <p class="foot-note" id="footNote"></p>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script src="/assets/data.js?v=14"></script>
<script>
const grid=document.getElementById('grid');
let query='', CATEGORY_PRODUCTS=[];

function currentCategorySlug(){
  const parts=location.pathname.split('/').filter(Boolean);
  const i=parts.indexOf('category');
  if(i!==-1 && parts[i+1]) return decodeURIComponent(parts[i+1]).toLowerCase();
  const p=new URLSearchParams(location.search);
  if(p.has('slug')) return p.get('slug').toLowerCase();
  return '';
}

function applyStaticUI(t){
  document.documentElement.lang=lang;
  document.getElementById('searchInput').placeholder=t.searchPh;
  document.getElementById('breadcrumbHome').textContent=t.breadcrumbHome;
  applyFooterUI(t);
}

function renderNotFound(t){
  document.getElementById('breadcrumbCategory').textContent='';
  document.getElementById('categoryTitle').textContent=t.categoryNotFoundTitle;
  document.getElementById('categorySub').innerHTML=escapeHTML(t.categoryNotFoundSub)+' <a href="/" style="color:var(--brand);font-weight:700">'+escapeHTML(t.backHome)+'</a>';
  grid.innerHTML='';
}

function render(){
  const t=UI[lang];
  const q=query.toLowerCase();
  const list=CATEGORY_PRODUCTS.filter(function(p){
    return !q || (p.brand+p.title).toLowerCase().includes(q);
  });
  if(!list.length){grid.innerHTML='<div class="state">'+t.empty+'</div>';return;}
  grid.innerHTML=list.map(function(p){return productCardHTML(p,t)}).join('');
}

const t=UI[lang];
applyStaticUI(t);
const slug=currentCategorySlug();
const catInfo=CATEGORIES.find(function(c){return c.slug===slug});
grid.innerHTML='<div class="state"><div class="spinner"></div>'+t.loading+'</div>';

if(!catInfo){
  renderNotFound(t);
}else{
  const catLabel=lang==='vi'?catInfo.vi:catInfo.en;
  document.getElementById('breadcrumbCategory').textContent=catLabel;
  document.getElementById('categoryTitle').textContent=tpl(t.categoryHeroTitleTpl,{category:catLabel});
  document.getElementById('categorySub').textContent=tpl(t.categoryHeroSubTpl,{category:catLabel});

  const title=tpl(t.categoryTitleTpl,{category:catLabel});
  const desc=tpl(t.categoryMetaDescTpl,{category:catLabel});
  const url=location.origin+'/category/'+slug;
  document.getElementById('metaTitle').textContent=title;
  document.getElementById('metaDesc').setAttribute('content',desc);
  document.getElementById('metaCanonical').setAttribute('href',url);

  fetchData().then(function(data){
    CATEGORY_PRODUCTS=groupToProducts(data.coupons).filter(function(p){return p.categories.indexOf(slug)!==-1});
    render();
    if(CATEGORY_PRODUCTS.length){
      injectJsonLd({
        "@context":"https://schema.org",
        "@type":"CollectionPage",
        "name": title,
        "url": url,
        "mainEntity":{
          "@type":"ItemList",
          "itemListElement": CATEGORY_PRODUCTS.map(function(p,i){
            return {"@type":"ListItem","position":i+1,"item":{
              "@type":"Offer","name":p.title,"description":p.desc,"url":location.origin+'/product/'+p.slug,
              "seller":{"@type":"Organization","name":p.brand}
            }};
          })
        }
      }, 'category-jsonld');
    }
  }).catch(function(e){
    grid.innerHTML='<div class="state">'+t.err+'</div>';
    console.error(e);
  });
}
document.getElementById('searchInput').addEventListener('input',function(e){query=e.target.value;render()});
</script>
</body>
</html>
