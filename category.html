<title id="metaTitle">Coupons & Promo Codes | Defio Coupon</title>
<meta id="metaDesc" name="description" content="Verified coupons and promo codes, updated regularly.">
<meta name="robots" content="index, follow">
<link id="metaCanonical" rel="canonical" href="https://defiocoupon.com/">
<meta name="theme-color" content="#13103A">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/defio.css?v=1">
<style>
.cat-title{display:flex;align-items:center;gap:14px}
.cat-title .ic{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.1);display:grid;place-items:center;flex-shrink:0}
.cat-title .ic svg.i{width:26px;height:26px;color:#fff}
.cat-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:28px 0 0}
.cat-chips a{flex-shrink:0;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:500;font-size:14px}
.cat-chips a:hover{border-color:var(--violet)}
.cat-chips a[aria-current="page"]{background:var(--violet-soft);border-color:var(--violet);color:var(--violet-deep)}
.cat-chips svg.i{width:16px;height:16px;color:var(--ink-soft)}
</style>
</head>
<body>

<div class="top">
  <header class="wrap hd" id="siteHeader"></header>
  <section class="wrap band">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="/">Home</a><span>/</span><span id="crumbCat">Category</span></nav>
    <div class="cat-title"><span class="ic" id="catIcon"></span><div><h1 id="catTitle">Coupons & promo codes</h1><p id="catSub"></p></div></div>
  </section>
</div>

<main class="wrap">
  <nav class="cat-chips" id="catChips" aria-label="Other categories"></nav>
  <section class="section" style="margin-top:22px">
    <div class="section-head"><div><h2 id="listTitle">All offers</h2><p id="listCount"></p></div></div>
    <div class="table">
      <div class="thead" aria-hidden="true"><span>Store and offer</span><span>Discount</span><span></span></div>
      <div id="rows" aria-busy="true"></div>
    </div>
    <button class="more" id="more" hidden>Show more codes</button>
  </section>
</main>

<footer class="site-foot" id="siteFooter"></footer>

<script src="/assets/data.js?v=23"></script>
<script src="/assets/defio.js?v=1"></script>
<script>
var STEP=20, shown=STEP, LIST=[];
function currentCategorySlug(){
  var parts=location.pathname.split('/').filter(Boolean);
  var i=parts.indexOf('category');
  if(i!==-1 && parts[i+1]) return decodeURIComponent(parts[i+1]).toLowerCase();
  var p=new URLSearchParams(location.search);
  return p.has('slug') ? p.get('slug').toLowerCase() : '';
}
var slug=currentCategorySlug(), cat=CATEGORIES.find(function(c){return c.slug===slug});
document.getElementById('rows').innerHTML=skeletonRows(5);
document.getElementById('catChips').innerHTML=CATEGORIES.map(function(c){return '<a href="/category/'+c.slug+'"'+(c.slug===slug?' aria-current="page"':'')+'>'+icon(c.slug)+escapeHTML(c.en)+'</a>'}).join('');

function render(){
  document.getElementById('listCount').textContent=LIST.length+(LIST.length===1?' offer':' offers');
  document.getElementById('rows').innerHTML=LIST.length?LIST.slice(0,shown).map(rowHTML).join(''):'<div class="state">No offers in this category yet. <a href="/">Browse all codes</a></div>';
  document.getElementById('more').hidden=LIST.length<=shown;
}
document.getElementById('more').addEventListener('click',function(){shown+=STEP;render()});

if(!cat){
  document.getElementById('crumbCat').textContent='Not found';
  document.getElementById('catTitle').textContent='Category not found';
  document.getElementById('catSub').textContent='This category does not exist.';
  document.getElementById('rows').removeAttribute('aria-busy');
  document.getElementById('rows').innerHTML='<div class="state"><a href="/">Browse all current codes</a></div>';
}else{
  var title=cat.en+' Coupons & Promo Codes 2026 | Defio Coupon';
  var desc='Verified '+cat.en+' coupons and promo codes from independent brands, updated regularly. Click to reveal and save.';
  var url=location.origin+'/category/'+slug;
  document.getElementById('metaTitle').textContent=title;
  document.getElementById('metaDesc').setAttribute('content',desc);
  document.getElementById('metaCanonical').setAttribute('href',url);
  document.getElementById('crumbCat').textContent=cat.en;
  document.getElementById('catIcon').innerHTML=icon(slug);
  document.getElementById('catTitle').textContent=cat.en+' coupons & promo codes';
  document.getElementById('catSub').textContent='Verified '+cat.en.toLowerCase()+' codes and deals, updated regularly.';
  document.getElementById('listTitle').textContent=cat.en;

  loadCoupons(function(data){
    LIST=groupToProducts(data.coupons).filter(function(p){return p.categories.indexOf(slug)!==-1}).reverse();
    document.getElementById('rows').removeAttribute('aria-busy');
    render();
    if(LIST.length)injectJsonLd({"@context":"https://schema.org","@type":"CollectionPage","name":title,"url":url,
      "mainEntity":{"@type":"ItemList","itemListElement":LIST.map(function(p,i){return {"@type":"ListItem","position":i+1,"item":{"@type":"Offer","name":p.title,"description":p.desc,"url":location.origin+'/coupons/'+p.slug,"seller":{"@type":"Organization","name":p.brand}}}})}},'category-jsonld');
  },function(){document.getElementById('rows').innerHTML='<div class="state">Codes could not load. Refresh the page to try again.</div>';});
}
</script>
</body>
</html>
