<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script async src="https://www.googletagmanager.com/gtag/js?id=G-S8TKFCCYL3"></script>

<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">

<!-- Cac the SEO duoi day duoc JS ghi de theo tung san pham sau khi tai du lieu -->
<title id="metaTitle">Coupon Code 2026</title>
<meta id="metaDesc" name="description" content="Verified coupon code, updated regularly.">
<meta name="robots" content="index, follow">
<link id="metaCanonical" rel="canonical" href="https://couponsmarkets.com/">

<meta id="ogTitleTag" property="og:title" content="Coupon Code 2026">
<meta id="ogDesc" property="og:description" content="Verified coupon code, updated regularly.">
<meta id="ogUrl" property="og:url" content="https://couponsmarkets.com/">
<meta name="theme-color" content="#3DAF1F">

<link rel="stylesheet" href="/assets/style.css?v=15">
</head>
<body>

<header>
  <div class="wrap hd">
    <a href="/" class="logo"><img src="/assets/img/logo.png?v=1" alt="CouponsMarkets" class="logo-img"></a>
    <div class="search"><input type="text" id="searchInput" aria-label="Search">
      <svg fill="none" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <p class="breadcrumb">
      <a href="/" id="breadcrumbHome"></a><span>/</span>
      <a href="/" id="breadcrumbBrand"></a><span>/</span>
      <span id="breadcrumbProduct"></span>
    </p>
    <section class="store-hero" id="productHero"></section>
    <p class="product-desc" id="productDesc"></p>
    <div class="product-columns" id="productColumns">
      <div class="offers" id="offers">
        <h2 id="codesHeading"></h2>
        <div id="offersList"></div>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="foot">
      <div><div class="logo" style="margin-bottom:8px"><img src="/assets/img/logo.png?v=1" alt="CouponsMarkets" class="logo-img"></div><div id="footTag"></div></div>
      <div>
        <div style="font-weight:700;color:var(--footer-heading);margin-bottom:8px" id="footInfo"></div>
        <div><a href="/about" id="footAbout"></a></div>
        <div><a href="/privacy-policy" id="footPrivacy"></a></div>
        <div><a href="/terms-of-use" id="footTerms"></a></div>
        <div><a href="/contact" id="footContact"></a></div>
      </div>
    </div>
    <p class="foot-note" id="footNote"></p>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script src="/assets/data.js?v=15"></script>
<script>
const offersList=document.getElementById('offersList');
const productColumns=document.getElementById('productColumns');

function currentProductSlug(){
  const parts=location.pathname.split('/').filter(Boolean);
  const i=parts.indexOf('product');
  if(i!==-1 && parts[i+1]) return decodeURIComponent(parts[i+1]).toLowerCase();
  const p=new URLSearchParams(location.search);
  if(p.has('slug')) return p.get('slug').toLowerCase();
  return '';
}

function applyStaticUI(t){
  document.documentElement.lang=lang;
  document.getElementById('searchInput').placeholder=t.searchPh;
  document.getElementById('breadcrumbHome').textContent=t.breadcrumbHome;
  document.getElementById('codesHeading').textContent=t.codesHeading;
  applyFooterUI(t);
}

function renderNotFound(t){
  document.getElementById('breadcrumbBrand').style.display='none';
  document.getElementById('breadcrumbProduct').textContent='';
  document.getElementById('productHero').innerHTML=
    '<div><h1>'+t.dealNotFoundTitle+'</h1><p>'+t.dealNotFoundSub+' <a href="/" style="color:var(--brand);font-weight:700">'+t.backHome+'</a></p></div>';
  document.getElementById('offers').style.display='none';
}

function renderProduct(p, t){
  const logoHTML=p.logo
    ? '<img src="'+escapeHTML(p.logo)+'" alt="'+escapeHTML(p.brand)+'" loading="lazy" onerror="this.outerHTML=\'<div class=\\\'fallback\\\'>'+escapeHTML(p.brand.charAt(0))+'</div>\'">'
    : '<div class="fallback">'+escapeHTML(p.brand.charAt(0))+'</div>';

  const brandUrl='/site/'+slugify(p.brand);
  document.getElementById('breadcrumbBrand').textContent=p.brand;
  document.getElementById('breadcrumbBrand').href=brandUrl;
  document.getElementById('breadcrumbProduct').textContent=p.title;
  document.getElementById('productHero').innerHTML=logoHTML+'<div><h1>'+escapeHTML(p.title)+'</h1><p>'+escapeHTML(p.brand)+'</p></div>';
  document.getElementById('productDesc').textContent=p.desc;
  offersList.innerHTML=p.offers.map(function(o){return offerRowHTML(o,t,{logo:p.logo,brand:p.brand})}).join('');

  const reviewHTML=reviewCardHTML(p);
  const existingCard=document.querySelector('.review-card');
  if(existingCard) existingCard.remove();
  if(reviewHTML) productColumns.insertAdjacentHTML('beforeend', reviewHTML);

  const url=location.origin+'/product/'+p.slug;
  const title=tpl(t.productTitleTpl,{title:p.title,brand:p.brand});
  const desc=tpl(t.productMetaDescTpl,{title:p.title,brand:p.brand});
  document.getElementById('metaTitle').textContent=title;
  document.getElementById('metaDesc').setAttribute('content',desc);
  document.getElementById('metaCanonical').setAttribute('href',url);
  document.getElementById('ogTitleTag').setAttribute('content',title);
  document.getElementById('ogDesc').setAttribute('content',desc);
  document.getElementById('ogUrl').setAttribute('content',url);

  injectJsonLd({
    "@context":"https://schema.org",
    "@type":"Product",
    "name": p.title,
    "description": p.desc,
    "brand":{"@type":"Brand","name":p.brand},
    "url": url,
    "offers": p.offers.map(function(o){
      return {"@type":"Offer","url":url,"availability":"https://schema.org/InStock","category":p.categories.join(", ")};
    })
  }, 'product-jsonld');
}

attachCodeEvents(offersList);

const t=UI[lang];
applyStaticUI(t);
const slug=currentProductSlug();
offersList.innerHTML='<div class="state"><div class="spinner"></div>'+t.loading+'</div>';

fetchData().then(function(data){
  const products=groupToProducts(data.coupons);
  const product=products.find(function(p){return p.slug===slug});
  if(!slug || !product){renderNotFound(t);return;}
  renderProduct(product, t);
}).catch(function(e){
  offersList.innerHTML='<div class="state">'+t.err+'</div>';
  console.error(e);
});
</script>
</body>
</html>
