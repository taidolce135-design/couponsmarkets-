<meta id="ogImage" property="og:image" content="https://defiocoupon.com/assets/img/og-image.jpg">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
.p-hero{display:flex;align-items:center;gap:18px}
.p-hero .plogo{width:72px;height:72px;border-radius:16px;background:#fff;object-fit:contain;padding:6px;flex-shrink:0}
.p-hero .plogo.fb{display:grid;place-items:center;font:700 28px var(--sans);color:var(--violet)}
.p-hero .meta{color:rgba(255,255,255,.7);font-size:14px;margin-top:6px}
.p-hero .meta strong{color:#fff}
.p-hero .ok{color:#5FE0BD}

.p-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;margin-top:32px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px}
.p-desc{padding:18px 22px;font-size:16px;color:#2B2748;margin-bottom:18px}
.offers h2{font:600 20px var(--sans);letter-spacing:-.02em;margin:0 0 12px}

.offer-card{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:18px;align-items:center;padding:18px 20px;margin-bottom:12px}
.offer-disc{text-align:center;border-right:1px dashed var(--line);padding-right:14px}
.offer-disc .big{display:block;font:700 30px/1 var(--sans);letter-spacing:-.04em;color:var(--violet)}
.offer-disc .big.is-word{font-size:17px;letter-spacing:-.01em}
.offer-disc .small{display:block;font-size:12px;color:var(--ink-soft);margin-top:3px}
.offer-type{display:inline-block;font:600 11px var(--mono);letter-spacing:.06em;color:var(--violet-deep);background:var(--violet-soft);border-radius:5px;padding:2px 7px;margin-bottom:6px}
.offer-card h3{font:600 16px/1.35 var(--sans);margin:0 0 4px}
.offer-card .note{font-size:13px;color:var(--ink-soft);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.offer-cta-group{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:180px}
.code-preview{display:flex;align-items:center;justify-content:center;height:42px;border:1.5px dashed #BDB6E0;border-radius:10px;background:var(--page);font:600 15px var(--mono);letter-spacing:.08em}
.code-preview .full{display:none}
.code-preview.revealed{border-color:var(--violet);background:var(--violet-soft);color:var(--violet-deep)}
.code-preview.revealed .full{display:inline}
.code-preview.revealed .masked{display:none}
.offer-cta{display:flex;align-items:center;justify-content:center;height:42px;border:0;border-radius:10px;background:var(--violet);color:#fff;font:600 14px var(--sans);cursor:pointer;padding:0 18px}
.offer-cta:hover{background:var(--violet-deep)}
.offer-cta.revealed{background:var(--ink)}
.offer-cta.deal-link{background:var(--ink)}
.offer-cta.deal-link:hover{background:#000}
.offer-visit-link{display:none;align-items:center;justify-content:center;gap:6px;height:42px;border-radius:10px;border:1.5px solid var(--violet);color:var(--violet);font-weight:600;font-size:14px}
.offer-visit-link.revealed{display:flex}
.offer-visit-link:hover{background:var(--violet-soft)}

.p-image{overflow:hidden;margin-bottom:16px}
.p-image img{width:100%;aspect-ratio:4/3;object-fit:contain;background:var(--page)}
.review{padding:20px 22px}
.review h2{font:600 17px var(--sans);margin:0 0 6px}
.rating{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:12px}
.stars{position:relative;display:inline-block;color:#E1DDF2;letter-spacing:2px;font-size:16px}
.stars-fill{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:#F5B83D}
.review-heading{font:600 15px var(--sans);margin:16px 0 6px}
.review-text{margin:0 0 10px;font-size:14px;color:#2B2748}
.review-list{list-style:none;margin:6px 0 0;padding:0}
.review-list li{font-size:14px;padding:8px 0;border-top:1px solid var(--line)}
.read-review{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-top:16px}
.read-review img{width:64px;height:64px;border-radius:10px;object-fit:contain;background:var(--page);flex-shrink:0}
.read-review b{display:block;font-size:12px;color:var(--violet)}
.read-review span{font-weight:600;font-size:14px;line-height:1.35}
.read-review:hover{border-color:var(--violet)}
.skel-box{height:120px;border-radius:16px;margin-bottom:12px;background:linear-gradient(90deg,#EEECF6 25%,#F7F6FC 50%,#EEECF6 75%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@media (max-width:900px){.p-layout{grid-template-columns:1fr}}
@media (max-width:600px){
  .offer-card{grid-template-columns:80px minmax(0,1fr);padding:16px}
  .offer-cta-group{grid-column:1/-1;min-width:0}
  .p-hero .plogo{width:56px;height:56px}
}
</style>
</head>
<body>

<div class="top">
  <header class="wrap hd" id="siteHeader" data-active="codes"></header>
  <section class="wrap band">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="/">Home</a><span>/</span><a href="/" id="crumbBrand">Store</a><span>/</span><span id="crumbTitle">Coupon</span></nav>
    <div class="p-hero" id="pHero"><div><h1>Loading coupon…</h1></div></div>
  </section>
</div>

<main class="wrap">
  <div class="p-layout">
    <div>
      <p class="panel p-desc" id="pDesc" hidden></p>
      <section class="offers">
        <h2>Available codes and deals</h2>
        <div id="offersList"><div class="skel-box"></div><div class="skel-box"></div></div>
      </section>
    </div>
    <aside id="pSide"></aside>
  </div>
</main>

<footer class="site-foot" id="siteFooter"></footer>

<script src="/assets/data.js?v=23"></script>
<script src="/assets/defio.js?v=2"></script>
<script>
var offersList=document.getElementById('offersList'), current=null, POSTS=[];

function currentCouponSlug(){
  var parts=location.pathname.split('/').filter(Boolean);
  var i=parts.indexOf('coupons');
  if(i!==-1 && parts[i+1]) return decodeURIComponent(parts[i+1]).toLowerCase();
  var p=new URLSearchParams(location.search);
  return p.has('slug') ? p.get('slug').toLowerCase() : '';
}

/* The 1 ma / 1 deal. Giu dung class .offer-card .code-btn .code-preview
   .offer-visit-link de attachCodeEvents() trong data.js hoat dong:
   bam "Get code" -> hien ma + copy; nut "Visit store" chi hien SAU do. */
function offerHTML(o, p){
  var d=fmtDisc(o.discount);
  var disc='<div class="offer-disc">'+(d.pre?'<span class="small">'+escapeHTML(d.pre)+'</span>':'')+'<span class="big'+(d.word?' is-word':'')+'">'+escapeHTML(d.big)+'</span>'+(d.post?'<span class="small">'+escapeHTML(d.post)+'</span>':'')+'</div>';
  var info='<div style="min-width:0"><span class="offer-type">'+(o.code?'CODE':'DEAL')+'</span><h3>'+escapeHTML(p.title)+'</h3>'
    +'<div class="note">'+(o.code?'<span class="ok">'+CHECK+'Verified</span>':'')+(/defio/i.test(o.code||'')?'<span class="excl">'+STAR+'Defio exclusive</span>':'')+'<span>'+(o.code?'Copy the code, then paste it at checkout.':'No code needed. The discount applies on the store site.')+'</span></div></div>';
  if(o.code){
    return '<div class="panel offer-card">'+disc+info
      +'<div class="offer-cta-group">'
        +'<div class="code-preview"><span class="masked">'+escapeHTML(mask(o.code))+'</span><span class="full">'+escapeHTML(o.code)+'</span></div>'
        +'<button type="button" class="offer-cta code-btn" data-code="'+escapeHTML(o.code)+'">Get code</button>'
        +'<a class="offer-visit-link" href="'+escapeHTML(o.url)+'" target="_blank" rel="nofollow noopener sponsored">Visit store'+ARROW+'</a>'
      +'</div></div>';
  }
  return '<div class="panel offer-card">'+disc+info
    +'<div class="offer-cta-group"><a class="offer-cta deal-link" href="'+escapeHTML(o.url)+'" target="_blank" rel="nofollow noopener sponsored">Get deal'+ARROW+'</a></div></div>';
}

function reviewPanel(p){
  if(!p.rating&&!p.review)return '';
  var num=parseFloat(p.rating), stars='';
  if(num&&!isNaN(num)){
    var w=Math.max(0,Math.min(5,num))/5*100;
    stars='<div class="rating"><span class="stars" aria-hidden="true">★★★★★<span class="stars-fill" style="width:'+w+'%">★★★★★</span></span>'+num.toFixed(1)+' / 5</div>';
  }
  return '<div class="panel review"><h2>'+escapeHTML(p.brand)+' at a glance</h2>'+stars+renderReviewMarkdown(p.review)+'</div>';
}

function renderSide(){
  if(!current)return;
  var p=current, imgMap=blogImageMap(POSTS), img=productImage(p,imgMap);
  var post=POSTS.find(function(x){return normKey(x.title)===normKey(p.brand)});
  var html=(img?'<div class="panel p-image"><img src="'+escapeHTML(sized(img))+'" alt="'+escapeHTML(p.brand)+'"></div>':'')
    +reviewPanel(p)
    +(post?'<a class="panel read-review" href="/blog/'+encodeURIComponent(post.slug)+'">'+(post.images[0]?'<img src="'+escapeHTML(sized(post.images[0],400))+'" alt="">':'')+'<div><b>Read our review</b><span>'+escapeHTML(postHeadline(post).title)+'</span></div></a>':'');
  document.getElementById('pSide').innerHTML=html;
  if(img)document.getElementById('ogImage').setAttribute('content',sized(img));
}

function renderProduct(p){
  current=p;
  var brandUrl='/site/'+slugify(p.brand);
  document.getElementById('crumbBrand').textContent=p.brand;
  document.getElementById('crumbBrand').href=brandUrl;
  document.getElementById('crumbTitle').textContent=p.title;
  var init=escapeHTML(p.brand.charAt(0));
  var logo=p.logo?'<img class="plogo" src="'+escapeHTML(p.logo)+'" alt="'+escapeHTML(p.brand)+'" onerror="this.outerHTML=\'<span class=&quot;plogo fb&quot;>'+init+'</span>\'">':'<span class="plogo fb">'+init+'</span>';
  var n=p.offers.length;
  document.getElementById('pHero').innerHTML=logo+'<div><h1>'+escapeHTML(p.title)+'</h1><div class="meta"><a href="'+brandUrl+'"><strong>'+escapeHTML(p.brand)+'</strong></a> · '+n+(n===1?' offer':' offers')+(codeOf(p)?' · <span class="ok">Verified</span>':'')+'</div></div>';
  var desc=document.getElementById('pDesc'); desc.textContent=p.desc; desc.hidden=!p.desc;
  offersList.innerHTML=p.offers.map(function(o){return offerHTML(o,p)}).join('');
  renderSide();

  var url=location.origin+'/coupons/'+p.slug;
  var title=p.title+' - '+p.brand+' Coupon Code 2026 | Defio Coupon';
  var metaDesc=p.title+' at '+p.brand+'. Verified coupon codes and deals, updated regularly. Click to reveal and copy.';
  document.getElementById('metaTitle').textContent=title;
  document.getElementById('metaDesc').setAttribute('content',metaDesc);
  document.getElementById('metaCanonical').setAttribute('href',url);
  document.getElementById('ogTitleTag').setAttribute('content',title);
  document.getElementById('ogDesc').setAttribute('content',metaDesc);
  document.getElementById('ogUrl').setAttribute('content',url);
  injectJsonLd({
    "@context":"https://schema.org","@type":"Product","name":p.title,"description":p.desc,
    "brand":{"@type":"Brand","name":p.brand},"url":url,
    "offers":p.offers.map(function(){return {"@type":"Offer","url":url,"availability":"https://schema.org/InStock","category":p.categories.join(", ")}})
  },'product-jsonld');
}

function renderNotFound(){
  document.getElementById('crumbBrand').style.display='none';
  document.getElementById('crumbTitle').textContent='Not found';
  document.getElementById('pHero').innerHTML='<div><h1>Deal not found</h1></div>';
  offersList.innerHTML='<div class="panel state">This deal may have expired. <a href="/">Browse all current codes</a></div>';
}

attachCodeEvents(offersList);
var slug=currentCouponSlug(), shownOnce=false;
loadCoupons(function(data){
  var product=groupToProducts(data.coupons).find(function(p){return p.slug===slug});
  if(!slug||!product){if(!shownOnce)renderNotFound();return;}
  /* dang xem ma da hien thi thi khong ve lai, tranh mat trang thai "revealed" */
  if(shownOnce&&offersList.querySelector('.revealed'))return;
  shownOnce=true; renderProduct(product);
},function(){offersList.innerHTML='<div class="panel state">Codes could not load. Refresh the page to try again.</div>';});
loadBlog(function(posts){POSTS=posts;renderSide();});
</script>
</body>
</html>
