<body>

<header>
  <div class="wrap hd">
    <a href="/" class="logo"><img src="/assets/img/logo.png?v=1" alt="CouponsMarkets" class="logo-img"></a>
    <div class="search"><input type="text" id="searchInput" aria-label="Search">
      <svg fill="none" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <section class="hero"><h1 id="heroTitle"></h1><p id="heroSub"></p><p id="heroNote" class="hero-note"></p></section>
    <img class="hero-banner" src="https://images.stockcake.com/public/7/8/0/780e1c85-65a3-4178-b3f7-4f416804d38b_large/joyful-shopping-friends-stockcake.jpg" alt="CouponsMarkets" loading="lazy">
  </div>

  <div class="marquee" id="marquee" aria-hidden="true"><div class="marquee-track" id="marqueeTrack"></div></div>

  <div class="wrap">
    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-title" id="catAllLabel"></div>
        <nav class="cat-list" id="catList"></nav>
      </aside>
      <div class="main-col">
        <div class="grid" id="grid"></div>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="foot">
      <div><div class="logo" style="margin-bottom:8px"><img src="/assets/img/logo.png?v=1" alt="CouponsMarkets" class="logo-img"></div><div id="footTag"></div></div>
      <div>
        <div style="font-weight:700;color:var(--footer-heading);margin-bottom:8px" id="footInfo"></div>
        <div><a href="/about" id="footAbout"></a></div>
        <div><a href="/privacy-policy" id="footPrivacy"></a></div>
        <div><a href="/terms-of-use" id="footTerms"></a></div>
        <div><a href="/contact" id="footContact"></a></div>
      </div>
    </div>
    <p class="foot-note" id="footNote"></p>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script src="/assets/data.js?v=14"></script>
<script>
const grid=document.getElementById('grid');
const catList=document.getElementById('catList');
let activeCat='all', query='', PRODUCTS=[], BRANDS=[];

function renderCatList(t){
  const items=[{slug:'all',label:t.catAllLabel,href:'/'}].concat(CATEGORIES.map(function(c){return {slug:c.slug,label:lang==='vi'?c.vi:c.en,href:'/category/'+c.slug}}));
  catList.innerHTML=items.map(function(c){
    return '<a href="'+c.href+'" data-cat="'+c.slug+'" class="'+(c.slug===activeCat?'active':'')+'">'+escapeHTML(c.label)+'</a>';
  }).join('');
}

function applyUI(){
  const t=UI[lang];
  document.documentElement.lang=lang;
  document.getElementById('searchInput').placeholder=t.searchPh;
  document.getElementById('heroTitle').textContent=t.heroTitle;
  document.getElementById('heroSub').textContent=t.heroSub;
  document.getElementById('heroNote').textContent=t.heroNote;
  document.getElementById('catAllLabel').textContent=t.catAllLabel;
  renderCatList(t);
  applyFooterUI(t);
}

function loadData(){
  const t=UI[lang];
  grid.innerHTML='<div class="state"><div class="spinner"></div>'+t.loading+'</div>';
  fetchData().then(function(data){
    PRODUCTS=groupToProducts(data.coupons); BRANDS=data.brands;
    renderMarquee(BRANDS, document.getElementById('marquee'), document.getElementById('marqueeTrack'));
    render();
    if(PRODUCTS.length) injectJsonLd(buildCouponJsonLd(PRODUCTS), 'coupons-jsonld');
  }).catch(function(e){
    grid.innerHTML='<div class="state">'+t.err+'</div>';
    console.error(e);
  });
}

function render(){
  const t=UI[lang];
  const list=PRODUCTS.filter(function(p){
    const okCat=activeCat==='all'||p.categories.indexOf(activeCat)!==-1;
    const q=query.toLowerCase();
    const okQ=!q||(p.brand+p.title).toLowerCase().includes(q);
    return okCat&&okQ;
  });
  if(!list.length){grid.innerHTML='<div class="state">'+t.empty+'</div>';return;}
  grid.innerHTML=list.map(function(p){return productCardHTML(p,t)}).join('');
}

catList.addEventListener('click',function(e){
  const link=e.target.closest('a');if(!link)return;
  e.preventDefault();
  activeCat=link.dataset.cat;
  catList.querySelectorAll('a').forEach(function(a){a.classList.toggle('active',a.dataset.cat===activeCat)});
  render();
});
document.getElementById('searchInput').addEventListener('input',function(e){query=e.target.value;render()});

applyUI();
loadData();
</script>
</body>
</html>
