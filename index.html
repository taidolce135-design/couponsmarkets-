<script src="/assets/data.js?v=21"></script>
<script>
const grid=document.getElementById('grid');
const catList=document.getElementById('catList');
let activeCat='all', query='', PRODUCTS=[], BRANDS=[];

function renderCatList(t){
  const items=[{slug:'all',label:t.catAllLabel,href:'/',icon:t.catAllIcon}].concat(CATEGORIES.map(function(c){return {slug:c.slug,label:lang==='vi'?c.vi:c.en,href:'/category/'+c.slug,icon:c.icon}}));
  catList.innerHTML=items.map(function(c){
    return '<a href="'+c.href+'" data-cat="'+c.slug+'" class="'+(c.slug===activeCat?'active':'')+'"><span class="cat-icon">'+c.icon+'</span>'+escapeHTML(c.label)+'</a>';
  }).join('');
}

function applyUI(){
  const t=UI[lang];
  document.documentElement.lang=lang;
  document.getElementById('searchInput').placeholder=t.searchPh;
  document.getElementById('navBlog').textContent=t.navBlog;
  document.getElementById('navAbout').textContent=t.navAbout;
  document.getElementById('heroTitle').textContent=t.heroTitle;
  document.getElementById('heroSub').textContent=t.heroSub;
  document.getElementById('heroNote').textContent=t.heroNote;
  document.getElementById('catAllLabel').textContent=t.catAllLabel;
  document.getElementById('trustSecure').textContent=t.trustSecure;
  document.getElementById('trustVerified').textContent=t.trustVerified;
  document.getElementById('trustDaily').textContent=t.trustDaily;
  document.getElementById('trustFree').textContent=t.trustFree;
  document.getElementById('howTitle').textContent=t.howTitle;
  document.getElementById('howStep1Title').textContent=t.howStep1Title;
  document.getElementById('howStep1Sub').textContent=t.howStep1Sub;
  document.getElementById('howStep2Title').textContent=t.howStep2Title;
  document.getElementById('howStep2Sub').textContent=t.howStep2Sub;
  document.getElementById('howStep3Title').textContent=t.howStep3Title;
  document.getElementById('howStep3Sub').textContent=t.howStep3Sub;
  renderCatList(t);
  applyFooterUI(t);
}

/* Lay % giam cao nhat trong 1 chuoi discount (vd "30%", "UP TO 30%").
   Chuoi khong co so % (vd "FROM $89") tra ve 0, se tu nhien khong lot vao top. */
function parseDiscountPercent(discount){
  const m=(discount||'').match(/(\d+)\s*%/);
  return m?parseInt(m[1],10):0;
}

function renderFeatured(t){
  const featuredWrap=document.getElementById('featuredWrap');
  const ranked=PRODUCTS.map(function(p){
    const best=Math.max.apply(null,[0].concat(p.offers.map(function(o){return parseDiscountPercent(o.discount)})));
    return {p:p,pct:best};
  }).filter(function(r){return r.pct>0}).sort(function(a,b){return b.pct-a.pct});
  if(!ranked.length){featuredWrap.style.display='none';return;}
  document.getElementById('featuredTitle').textContent=t.featuredTitle;
  document.getElementById('featuredGrid').innerHTML=ranked.slice(0,3).map(function(r){return productCardHTML(r.p,t)}).join('');
  featuredWrap.style.display='';
}

function loadData(){
  const t=UI[lang];
  grid.innerHTML='<div class="state"><div class="spinner"></div>'+t.loading+'</div>';
  fetchData().then(function(data){
    PRODUCTS=groupToProducts(data.coupons); BRANDS=data.brands;
    renderMarquee(BRANDS, document.getElementById('marquee'), document.getElementById('marqueeTrack'));
    renderFeatured(t);
    render();
    if(PRODUCTS.length) injectJsonLd(buildCouponJsonLd(PRODUCTS), 'coupons-jsonld');
  }).catch(function(e){
    grid.innerHTML='<div class="state">'+t.err+'</div>';
    console.error(e);
  });
}

function render(){
  const t=UI[lang];
  const list=PRODUCTS.filter(function(p){
    const okCat=activeCat==='all'||p.categories.indexOf(activeCat)!==-1;
    const q=query.toLowerCase();
    const okQ=!q||(p.brand+p.title).toLowerCase().includes(q);
    return okCat&&okQ;
  });
  if(!list.length){grid.innerHTML='<div class="state">'+t.empty+'</div>';return;}
  grid.innerHTML=list.map(function(p){return productCardHTML(p,t)}).join('');
}

catList.addEventListener('click',function(e){
  const link=e.target.closest('a');if(!link)return;
  e.preventDefault();
  activeCat=link.dataset.cat;
  catList.querySelectorAll('a').forEach(function(a){a.classList.toggle('active',a.dataset.cat===activeCat)});
  render();
});
document.getElementById('searchInput').addEventListener('input',function(e){query=e.target.value;render()});

applyUI();
loadData();
</script>
