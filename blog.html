<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-S8TKFCCYL3"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag("js", new Date());
  gtag("config", "G-S8TKFCCYL3");
</script>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">

<title id="metaTitle">Blog | CouponsMarkets</title>
<meta id="metaDesc" name="description" content="Shopping tips, deal roundups and stories from the CouponsMarkets team.">
<meta name="robots" content="index, follow">
<link id="metaCanonical" rel="canonical" href="https://defiocoupon.com/blog">
<meta name="theme-color" content="#3DAF1F">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css?v=21">
</head>
<body>

<header>
  <div class="wrap hd">
    <a href="/" class="logo"><img src="/assets/img/logo.png?v=1" alt="CouponsMarkets" class="logo-img"></a>
    <div class="search"><input type="text" id="searchInput" aria-label="Search">
      <svg fill="none" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    </div>
    <nav class="hd-nav"><a href="/blog" id="navBlog"></a><a href="/about" id="navAbout"></a></nav>
  </div>
</header>

<main>
  <div class="wrap">
    <p class="breadcrumb"><a href="/" id="breadcrumbHome"></a><span>/</span><span id="breadcrumbBlog"></span></p>
    <section class="hero"><h1 id="blogHeroTitle"></h1><p id="blogHeroSub"></p></section>
  </div>

  <div class="wrap">
    <div class="blog-grid" id="blogGrid"></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="foot">
      <div><div class="logo" style="margin-bottom:8px"><img src="/assets/img/logo.png?v=1" alt="CouponsMarkets" class="logo-img"></div><div id="footTag"></div></div>
      <div>
        <div class="foot-heading" id="footCategories"></div>
        <div class="foot-cat-grid" id="footCatGrid"></div>
      </div>
      <div>
        <div style="font-weight:700;color:var(--footer-heading);margin-bottom:8px" id="footInfo"></div>
        <div><a href="/about" id="footAbout"></a></div>
        <div><a href="/privacy-policy" id="footPrivacy"></a></div>
        <div><a href="/terms-of-use" id="footTerms"></a></div>
        <div><a href="/contact" id="footContact"></a></div>
        <div><a href="/blog" id="footBlog"></a></div>
      </div>
    </div>
    <p class="foot-note" id="footNote"></p>
  </div>
</footer>

<script src="/assets/data.js?v=22"></script>
<script>
const blogGrid=document.getElementById('blogGrid');

function applyStaticUI(t){
  document.documentElement.lang=lang;
  document.getElementById('searchInput').placeholder=t.searchPh;
  document.getElementById('navBlog').textContent=t.navBlog;
  document.getElementById('navAbout').textContent=t.navAbout;
  document.getElementById('breadcrumbHome').textContent=t.breadcrumbHome;
  document.getElementById('breadcrumbBlog').textContent=t.navBlog;
  document.getElementById('blogHeroTitle').textContent=t.blogHeroTitle;
  document.getElementById('blogHeroSub').textContent=t.blogHeroSub;
  document.getElementById('metaTitle').textContent=t.blogPageTitle;
  document.getElementById('metaDesc').setAttribute('content',t.blogPageMetaDesc);
  applyFooterUI(t);
}

const t=UI[lang];
applyStaticUI(t);
blogGrid.innerHTML='<div class="state"><div class="spinner"></div>'+t.loading+'</div>';

fetchBlogPosts().then(function(posts){
  if(!posts.length){blogGrid.innerHTML='<div class="state">'+t.blogEmpty+'</div>';return;}
  blogGrid.innerHTML=posts.map(function(p){return blogCardHTML(p,t)}).join('');
}).catch(function(e){
  blogGrid.innerHTML='<div class="state">'+t.err+'</div>';
  console.error(e);
});
</script>
</body>
</html>
