<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">

<!-- Cac the SEO duoi day duoc JS ghi de theo tung bai blog sau khi tai du lieu -->
<title id="metaTitle">Blog | CouponsMarkets</title>
<meta id="metaDesc" name="description" content="">
<meta name="robots" content="index, follow">
<link id="metaCanonical" rel="canonical" href="https://defiocoupon.com/blog">
<meta name="theme-color" content="#3DAF1F">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css?v=21">
</head>
<body>

<header>
  <div class="wrap hd">
    <a href="/" class="logo"><img src="/assets/img/logo.png?v=1" alt="CouponsMarkets" class="logo-img"></a>
    <div class="search"><input type="text" id="searchInput" aria-label="Search">
      <svg fill="none" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    </div>
    <nav class="hd-nav"><a href="/blog" id="navBlog"></a><a href="/about" id="navAbout"></a></nav>
  </div>
</header>

<main>
  <div class="wrap">
    <p class="breadcrumb">
      <a href="/" id="breadcrumbHome"></a><span>/</span>
      <a href="/blog" id="breadcrumbBlog"></a><span>/</span>
      <span id="breadcrumbPost"></span>
    </p>
    <div class="page-content" id="postContent"></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="foot">
      <div><div class="logo" style="margin-bottom:8px"><img src="/assets/img/logo.png?v=1" alt="CouponsMarkets" class="logo-img"></div><div id="footTag"></div></div>
      <div>
        <div class="foot-heading" id="footCategories"></div>
        <div class="foot-cat-grid" id="footCatGrid"></div>
      </div>
      <div>
        <div style="font-weight:700;color:var(--footer-heading);margin-bottom:8px" id="footInfo"></div>
        <div><a href="/about" id="footAbout"></a></div>
        <div><a href="/privacy-policy" id="footPrivacy"></a></div>
        <div><a href="/terms-of-use" id="footTerms"></a></div>
        <div><a href="/contact" id="footContact"></a></div>
        <div><a href="/blog" id="footBlog"></a></div>
      </div>
    </div>
    <p class="foot-note" id="footNote"></p>
  </div>
</footer>

<script src="/assets/data.js?v=22"></script>
<script>
const postContent=document.getElementById('postContent');

function currentPostSlug(){
  const parts=location.pathname.split('/').filter(Boolean);
  const i=parts.indexOf('blog');
  if(i!==-1 && parts[i+1]) return decodeURIComponent(parts[i+1]).toLowerCase();
  const p=new URLSearchParams(location.search);
  if(p.has('slug')) return p.get('slug').toLowerCase();
  return '';
}

function applyStaticUI(t){
  document.documentElement.lang=lang;
  document.getElementById('searchInput').placeholder=t.searchPh;
  document.getElementById('navBlog').textContent=t.navBlog;
  document.getElementById('navAbout').textContent=t.navAbout;
  document.getElementById('breadcrumbHome').textContent=t.breadcrumbHome;
  document.getElementById('breadcrumbBlog').textContent=t.navBlog;
  applyFooterUI(t);
}

function renderNotFound(t){
  document.getElementById('breadcrumbPost').textContent='';
  postContent.innerHTML='<h1>'+escapeHTML(t.blogPostNotFoundTitle)+'</h1><p>'+escapeHTML(t.blogPostNotFoundSub)+' <a href="/blog" style="color:var(--brand);font-weight:700">'+escapeHTML(t.backToBlog)+'</a></p>';
}

function renderPost(post, t){
  document.getElementById('breadcrumbPost').textContent=post.title;
  document.getElementById('metaTitle').textContent=post.title+' | CouponsMarkets Blog';
  document.getElementById('metaDesc').setAttribute('content', post.content.slice(0,160));
  document.getElementById('metaCanonical').setAttribute('href', location.origin+'/blog/'+post.slug);
  postContent.innerHTML='<h1>'+escapeHTML(post.title)+'</h1>'+blogGalleryHTML(post.images)+renderPageContent(post.content);
}

const t=UI[lang];
applyStaticUI(t);
const slug=currentPostSlug();
postContent.innerHTML='<div class="state"><div class="spinner"></div>'+t.loading+'</div>';

fetchBlogPosts().then(function(posts){
  const post=posts.find(function(p){return p.slug===slug});
  if(!slug || !post){renderNotFound(t);return;}
  renderPost(post, t);
}).catch(function(e){
  postContent.innerHTML='<div class="state">'+t.err+'</div>';
  console.error(e);
});
</script>
</body>
</html>
