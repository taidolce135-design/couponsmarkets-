<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script async src="https://www.googletagmanager.com/gtag/js?id=G-S8TKFCCYL3"></script>

  gtag("js", new Date());

<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">

<!-- Cac the SEO duoi day duoc JS ghi de theo tung brand sau khi tai du lieu -->
<title id="metaTitle">Store Coupons & Promo Codes 2026</title>
<meta id="metaDesc" name="description" content="Verified coupons and promo codes, updated regularly.">
<meta name="robots" content="index, follow">
<link id="metaCanonical" rel="canonical" href="https://couponsmarkets.com/site/">

<meta id="ogTitle" property="og:type" content="website">
<meta id="ogTitleTag" property="og:title" content="Store Coupons & Promo Codes 2026">
<meta id="ogDesc" property="og:description" content="Verified coupons and promo codes, updated regularly.">
<meta id="ogUrl" property="og:url" content="https://couponsmarkets.com/site/">
<meta name="theme-color" content="#3DAF1F">

<link rel="stylesheet" href="/assets/style.css?v=15">
</head>
<body>

<header>
  <div class="wrap hd">
    <a href="/" class="logo"><img src="/assets/img/logo.png?v=1" alt="CouponsMarkets" class="logo-img"></a>
    <div class="search"><input type="text" id="searchInput" aria-label="Search">
      <svg fill="none" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <p class="breadcrumb"><a href="/" id="breadcrumbHome"></a><span>/</span><span id="breadcrumbBrand"></span></p>
    <section class="store-hero" id="storeHero"></section>
  </div>

  <div class="wrap">
    <div class="grid" id="grid"></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="foot">
      <div><div class="logo" style="margin-bottom:8px"><img src="/assets/img/logo.png?v=1" alt="CouponsMarkets" class="logo-img"></div><div id="footTag"></div></div>
      <div>
        <div style="font-weight:700;color:var(--footer-heading);margin-bottom:8px" id="footInfo"></div>
        <div><a href="/about" id="footAbout"></a></div>
        <div><a href="/privacy-policy" id="footPrivacy"></a></div>
        <div><a href="/terms-of-use" id="footTerms"></a></div>
        <div><a href="/contact" id="footContact"></a></div>
      </div>
    </div>
    <p class="foot-note" id="footNote"></p>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script src="/assets/data.js?v=15"></script>
<script>
const grid=document.getElementById('grid');
attachCardEvents(grid);

/* Lay slug tu duong dan dep /site/xxx (can rule redirect o hosting, xem _redirects / vercel.json).
   Neu mo truc tiep site.html (test cuc bo), dung ?store=xxx thay the. */
function currentSlug(){
  const parts=location.pathname.split('/').filter(Boolean);
  const i=parts.indexOf('site');
  if(i!==-1 && parts[i+1]) return decodeURIComponent(parts[i+1]).toLowerCase();
  const p=new URLSearchParams(location.search);
  if(p.has('store')) return p.get('store').toLowerCase();
  return '';
}

function applyStaticUI(t){
  document.documentElement.lang=lang;
  document.getElementById('searchInput').placeholder=t.searchPh;
  document.getElementById('breadcrumbHome').textContent=t.breadcrumbHome;
  applyFooterUI(t);
}

function renderNotFound(t){
  document.getElementById('breadcrumbBrand').textContent='';
  document.getElementById('storeHero').innerHTML=
    '<div><h1>'+t.storeNotFoundTitle+'</h1><p>'+t.storeNotFoundSub+' <a href="/" style="color:var(--brand);font-weight:700">'+t.backHome+'</a></p></div>';
  grid.innerHTML='';
}

function renderStore(brand, products, t){
  const logoUrl=(products.find(function(p){return p.logo})||{}).logo||'';
  document.getElementById('breadcrumbBrand').textContent=brand;
  const logoHTML=logoUrl
    ? '<img src="'+escapeHTML(logoUrl)+'" alt="'+escapeHTML(brand)+'" loading="lazy" onerror="this.outerHTML=\'<div class=\\\'fallback\\\'>'+escapeHTML(brand.charAt(0))+'</div>\'">'
    : '<div class="fallback">'+escapeHTML(brand.charAt(0))+'</div>';
  document.getElementById('storeHero').innerHTML=
    logoHTML+'<div><h1>'+escapeHTML(brand)+'</h1><p>'+escapeHTML(tpl(t.storeSub,{brand:brand}))+'</p></div>';
  grid.innerHTML=products.map(function(p){return productCardHTML(p,t)}).join('');

  const slug=slugify(brand);
  const url=location.origin+'/site/'+slug;
  document.getElementById('metaTitle').textContent=tpl(t.storeTitle,{brand:brand});
  document.getElementById('metaDesc').setAttribute('content',tpl(t.storeMetaDesc,{brand:brand}));
  document.getElementById('metaCanonical').setAttribute('href',url);
  document.getElementById('ogTitleTag').setAttribute('content',tpl(t.storeTitle,{brand:brand}));
  document.getElementById('ogDesc').setAttribute('content',tpl(t.storeMetaDesc,{brand:brand}));
  document.getElementById('ogUrl').setAttribute('content',url);

  injectJsonLd({
    "@context":"https://schema.org",
    "@type":"CollectionPage",
    "name": tpl(t.storeTitle,{brand:brand}),
    "url": url,
    "about":{"@type":"Organization","name":brand},
    "mainEntity":{
      "@type":"ItemList",
      "itemListElement": products.map(function(p,i){
        return {"@type":"ListItem","position":i+1,"item":{
          "@type":"Offer","name":p.title,"description":p.desc,"url":location.origin+'/product/'+p.slug,
          "category":p.categories.join(", "),"seller":{"@type":"Organization","name":brand}
        }};
      })
    }
  }, 'store-jsonld');
}

const t=UI[lang];
applyStaticUI(t);
const slug=currentSlug();
grid.innerHTML='<div class="state"><div class="spinner"></div>'+t.loading+'</div>';

fetchData().then(function(data){
  const products=groupToProducts(data.coupons).filter(function(p){return slugify(p.brand)===slug});
  if(!slug || !products.length){renderNotFound(t);return;}
  renderStore(products[0].brand, products, t);
}).catch(function(e){
  grid.innerHTML='<div class="state">'+t.err+'</div>';
  console.error(e);
});
</script>
</body>
</html>
