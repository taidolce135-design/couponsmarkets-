.s-hero{display:flex;align-items:center;gap:18px}
.s-hero .slogo{width:72px;height:72px;border-radius:16px;background:#fff;object-fit:contain;padding:6px;flex-shrink:0}
.s-hero .slogo.fb{display:grid;place-items:center;font:700 28px var(--sans);color:var(--violet)}
.s-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;margin-top:32px;align-items:start}
.s-side .panel{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px}
.s-side .panel img{width:100%;aspect-ratio:4/3;object-fit:contain;background:var(--page)}
.s-side .panel div{padding:14px 16px}

<body>

<div class="top">
  <header class="wrap hd" id="siteHeader" data-active="stores"></header>
  <section class="wrap band">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="/">Home</a><span>/</span><a href="/#stores">Stores</a><span>/</span><span id="crumbStore">Store</span></nav>
    <div class="s-hero" id="sHero"><div><h1>Loading store…</h1></div></div>
  </section>
</div>

<main class="wrap">
  <div class="s-layout">
    <section>
      <div class="section-head"><div><h2>Codes and deals</h2><p id="listCount"></p></div></div>
      <div class="table"><div id="rows" aria-busy="true"></div></div>
    </section>
    <aside class="s-side" id="sSide"></aside>
  </div>
</main>

<footer class="site-foot" id="siteFooter"></footer>

<script src="/assets/data.js?v=23"></script>
<script src="/assets/defio.js?v=2"></script>
<script>
/* Lay slug tu /site/xxx (rewrite o vercel.json). Mo truc tiep site.html thi dung ?store=xxx */
function currentSlug(){
  var parts=location.pathname.split('/').filter(Boolean);
  var i=parts.indexOf('site');
  if(i!==-1 && parts[i+1]) return decodeURIComponent(parts[i+1]).toLowerCase();
  var p=new URLSearchParams(location.search);
  return p.has('store') ? p.get('store').toLowerCase() : '';
}
var slug=currentSlug(), brand='', POSTS=[];
document.getElementById('rows').innerHTML=skeletonRows(3);

function renderSide(){
  if(!brand)return;
  var post=POSTS.find(function(x){return normKey(x.title)===normKey(brand)});
  document.getElementById('sSide').innerHTML=post?'<a class="panel" href="/blog/'+encodeURIComponent(post.slug)+'" style="display:block">'+(post.images[0]?'<img src="'+escapeHTML(sized(post.images[0]))+'" alt="'+escapeHTML(brand)+'">':'')+'<div><b>Read our '+escapeHTML(brand)+' review</b><span>'+escapeHTML(postHeadline(post).title)+'</span></div></a>':'';
}

loadCoupons(function(data){
  var products=groupToProducts(data.coupons).filter(function(p){return slugify(p.brand)===slug});
  document.getElementById('rows').removeAttribute('aria-busy');
  if(!slug||!products.length){
    document.getElementById('crumbStore').textContent='Not found';
    document.getElementById('sHero').innerHTML='<div><h1>Store not found</h1></div>';
    document.getElementById('rows').innerHTML='<div class="state">We could not find this store. <a href="/">Browse all current codes</a></div>';
    return;
  }
  brand=products[0].brand;
  var logoP=products.find(function(p){return p.logo})||products[0], init=escapeHTML(brand.charAt(0));
  var logo=logoP.logo?'<img class="slogo" src="'+escapeHTML(logoP.logo)+'" alt="'+escapeHTML(brand)+'" onerror="this.outerHTML=\'<span class=&quot;slogo fb&quot;>'+init+'</span>\'">':'<span class="slogo fb">'+init+'</span>';
  document.getElementById('crumbStore').textContent=brand;
  document.getElementById('sHero').innerHTML=logo+'<div><h1>'+escapeHTML(brand)+' coupons & promo codes</h1><p>Verified '+escapeHTML(brand)+' codes and deals, updated regularly.</p></div>';
  document.getElementById('listCount').textContent=products.length+(products.length===1?' offer':' offers');
  document.getElementById('rows').innerHTML=products.map(rowHTML).join('');
  renderSide();

  var url=location.origin+'/site/'+slug, title=brand+' Coupons & Promo Codes 2026 | Defio Coupon';
  var desc=brand+' coupons and promo codes 2026: verified codes and deals, updated regularly. Click to copy and save at '+brand+'.';
  document.getElementById('metaTitle').textContent=title;
  document.getElementById('metaDesc').setAttribute('content',desc);
  document.getElementById('metaCanonical').setAttribute('href',url);
  document.getElementById('ogTitleTag').setAttribute('content',title);
  document.getElementById('ogDesc').setAttribute('content',desc);
  document.getElementById('ogUrl').setAttribute('content',url);
  injectJsonLd({"@context":"https://schema.org","@type":"CollectionPage","name":title,"url":url,"about":{"@type":"Organization","name":brand},
    "mainEntity":{"@type":"ItemList","itemListElement":products.map(function(p,i){return {"@type":"ListItem","position":i+1,"name":p.title,"url":location.origin+'/coupons/'+p.slug}})}},'store-jsonld');
},function(){document.getElementById('rows').innerHTML='<div class="state">Codes could not load. Refresh the page to try again.</div>';});
loadBlog(function(posts){POSTS=posts;renderSide();});
</script>
</body>
