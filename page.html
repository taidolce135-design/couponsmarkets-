<body>

<div class="top">
  <header class="wrap hd" id="siteHeader"></header>
  <section class="wrap band">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="/">Home</a><span>/</span><span id="crumbPage"></span></nav>
    <h1 id="pageTitle">Loading…</h1>
  </section>
</div>

<main class="wrap">
  <article class="prose" id="pageContent"></article>
</main>

<footer class="site-foot" id="siteFooter"></footer>

<script src="/assets/data.js?v=23"></script>
<script src="/assets/defio.js?v=2"></script>
<script>
function currentPageSlug(){
  var path=location.pathname.replace(/^\/|\/$/g,'').replace(/\.html$/,'');
  if(path&&path!=='page') return path.toLowerCase();
  return (new URLSearchParams(location.search).get('slug')||'').toLowerCase();
}
var slug=currentPageSlug(), el=document.getElementById('pageContent');
if(slug==='about'){document.getElementById('siteHeader').dataset.active='about';renderSiteHeader();}

function show(page){
  if(!page){
    document.getElementById('pageTitle').textContent='Page not found';
    el.innerHTML='<p>We could not find this page. <a href="/" style="color:var(--violet);font-weight:600">Back to the homepage</a></p>';
    return;
  }
  document.getElementById('metaTitle').textContent=page.title+' | Defio Coupon';
  document.getElementById('metaDesc').setAttribute('content',page.metaDesc||'');
  document.getElementById('metaCanonical').setAttribute('href',location.origin+'/'+slug);
  document.getElementById('crumbPage').textContent=page.title;
  document.getElementById('pageTitle').textContent=page.title;
  el.innerHTML=renderPageContent(page.content);
}
/* Hien noi dung mac dinh ngay, roi thay bang noi dung tu Sheet neu co */
if(FALLBACK_PAGES[slug])show(FALLBACK_PAGES[slug]);
fetchPage(slug).then(show).catch(function(e){console.error(e);if(!FALLBACK_PAGES[slug])show(null);});
</script>
</body>
