<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-S8TKFCCYL3"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag("js", new Date());
  gtag("config", "G-S8TKFCCYL3");
</script>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">

<title id="metaTitle">CouponsMarkets</title>
<meta id="metaDesc" name="description" content="">
<meta name="robots" content="index, follow">
<link id="metaCanonical" rel="canonical" href="https://couponsmarkets.com/">

<meta name="theme-color" content="#3DAF1F">
<link rel="stylesheet" href="/assets/style.css?v=15">
</head>
<body>

<header>
  <div class="wrap hd">
    <a href="/" class="logo"><img src="/assets/img/logo.png?v=1" alt="CouponsMarkets" class="logo-img"></a>
    <div class="search"><input type="text" id="searchInput" aria-label="Search">
      <svg fill="none" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <p class="breadcrumb"><a href="/" id="breadcrumbHome"></a><span>/</span><span id="breadcrumbPage"></span></p>
    <div class="page-content" id="pageContent"></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="foot">
      <div><div class="logo" style="margin-bottom:8px"><img src="/assets/img/logo.png?v=1" alt="CouponsMarkets" class="logo-img"></div><div id="footTag"></div></div>
      <div>
        <div style="font-weight:700;color:var(--footer-heading);margin-bottom:8px" id="footInfo"></div>
        <div><a href="/about" id="footAbout"></a></div>
        <div><a href="/privacy-policy" id="footPrivacy"></a></div>
        <div><a href="/terms-of-use" id="footTerms"></a></div>
        <div><a href="/contact" id="footContact"></a></div>
      </div>
    </div>
    <p class="foot-note" id="footNote"></p>
  </div>
</footer>

<script src="/assets/data.js?v=14"></script>
<script>
function currentPageSlug(){
  const path=location.pathname.replace(/^\/|\/$/g,'');
  if(path) return path.toLowerCase();
  const p=new URLSearchParams(location.search);
  return (p.get('slug')||'').toLowerCase();
}

function applyStaticUI(t){
  document.documentElement.lang=lang;
  document.getElementById('searchInput').placeholder=t.searchPh;
  document.getElementById('breadcrumbHome').textContent=t.breadcrumbHome;
  applyFooterUI(t);
}

const t=UI[lang];
applyStaticUI(t);
const slug=currentPageSlug();
const pageContent=document.getElementById('pageContent');
pageContent.innerHTML='<div class="state"><div class="spinner"></div>'+t.loading+'</div>';

fetchPage(slug).then(function(page){
  if(!page){
    document.getElementById('breadcrumbPage').textContent='';
    pageContent.innerHTML='<h1>'+t.pageNotFoundTitle+'</h1><p>'+t.pageNotFoundSub+' <a href="/" style="color:var(--brand);font-weight:700">'+t.backHome+'</a></p>';
    return;
  }
  document.getElementById('metaTitle').textContent=page.title+' | CouponsMarkets';
  document.getElementById('metaDesc').setAttribute('content', page.metaDesc||'');
  document.getElementById('metaCanonical').setAttribute('href', location.origin+'/'+slug);
  document.getElementById('breadcrumbPage').textContent=page.title;
  pageContent.innerHTML='<h1>'+escapeHTML(page.title)+'</h1>'+renderPageContent(page.content);
}).catch(function(e){
  pageContent.innerHTML='<div class="state">'+t.err+'</div>';
  console.error(e);
});
</script>
</body>
</html>
